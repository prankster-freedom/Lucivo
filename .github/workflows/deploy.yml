name: Deploy

# 公開用 URL（ルート /）とテスト用 URL（/preview/）を分離してビルド・デプロイする（Ref #104, #106）。
# - 公開用（/）: 最新リリースタグ（lucivo-v*）を、タグの注釈の版の表記 "X.Y.Z (build #N)" でビルドして配置
# - テスト用（/preview/）: main ブランチを "X.Y.Z-canary (build #N)" でビルドして配置
on:
  push:
    branches:
      - main
    tags:
      - "lucivo-v*"
  release:
    types: [published]
  workflow_run:
    workflows: ["Self Approve", "Canary Auto Merge", "Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build GitHub Pages site (production + canary preview)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            PROD_REF="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/lucivo-v* ]]; then
            PROD_REF="${{ github.ref_name }}"
          else
            PROD_REF="$(git tag --list 'lucivo-v*' --sort=-v:refname | head -n 1)"
          fi
          if [ -z "$PROD_REF" ]; then
            PROD_REF="main"
          fi

          PROD_PKG_VER="$(git show "${PROD_REF}:package.json" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(d.version)")"
          MAIN_PKG_VER="$(node -p "require('./package.json').version")"

          CANARY_BASE="$(node -e "
            const p = process.argv[1].split('.').map(Number);
            const m = process.argv[2].split('.').map(Number);
            const cmp = (m[0]-p[0]) || (m[1]-p[1]) || (m[2]-p[2]);
            if (cmp > 0) console.log(process.argv[2]);
            else console.log([p[0], p[1], (p[2]||0)+1].join('.'));
          " "$PROD_PKG_VER" "$MAIN_PKG_VER")"

          CANARY_VERSION="${CANARY_BASE}-canary (build #${{ github.run_number }})"

          echo "Production ref: $PROD_REF (pkg $PROD_PKG_VER)"
          echo "Preview ref: main -> $CANARY_VERSION"

          rm -rf _site /tmp/lucivo-prod /tmp/lucivo-release
          mkdir -p _site _site/preview /tmp/lucivo-release

          # 1. 本番（/）: 最新のタグからビルドし直す（doc/2.ARCHITECTURE.md 4.14 ARC-PUB-005）。
          #    版の表記は、release.yml がタグの注釈に書いた "LUCIVO_VERSION: X.Y.Z (build #N)" から読み、
          #    GitHub Release の ZIP とビルド番号をそろえる。
          #    注釈に版の表記がないタグ（lucivo-v0.9.2 以前）は、GitHub Release の Lucivo-v<版>.zip を展開する。
          #    Pages の公開は毎回サイト全体を置き換えるため、Canary の公開のたびに本番も作り直す
          PROD_BUILD_VERSION=""
          if [ "$(git cat-file -t "refs/tags/${PROD_REF}" 2>/dev/null)" = "tag" ]; then
            PROD_BUILD_VERSION="$(git for-each-ref "refs/tags/${PROD_REF}" --format='%(contents)' \
              | sed -n 's/^LUCIVO_VERSION: *//p' | head -n 1)"
          fi

          if [ -n "$PROD_BUILD_VERSION" ]; then
            echo "Production: tag build ${PROD_REF} -> ${PROD_BUILD_VERSION}"
            git worktree add --detach /tmp/lucivo-prod "$PROD_REF"
            (cd /tmp/lucivo-prod && npm ci && LUCIVO_VERSION_OVERRIDE="$PROD_BUILD_VERSION" node tools/build-app.cjs --prod)
            cp -R /tmp/lucivo-prod/public/. _site/
            git worktree remove --force /tmp/lucivo-prod
          else
            ZIP_DIR="Lucivo-v${PROD_PKG_VER}"
            ZIP_NAME="${ZIP_DIR}.zip"
            rm -rf /tmp/lucivo-release && mkdir -p /tmp/lucivo-release
            if gh release download "$PROD_REF" -p "$ZIP_NAME" -D /tmp/lucivo-release \
              && unzip -oq "/tmp/lucivo-release/${ZIP_NAME}" -d /tmp/lucivo-release \
              && [ -f "/tmp/lucivo-release/${ZIP_DIR}/index.html" ]; then
              echo "Production: release artifact ${ZIP_NAME} from ${PROD_REF} (tag has no version annotation)"
              cp -R "/tmp/lucivo-release/${ZIP_DIR}/." _site/
            else
              echo "Release artifact not found for ${PROD_REF}; falling back to tag build"
              git worktree add --detach /tmp/lucivo-prod "$PROD_REF"
              (cd /tmp/lucivo-prod && npm ci && LUCIVO_VERSION_OVERRIDE="$PROD_PKG_VER" node tools/build-app.cjs --prod)
              cp -R /tmp/lucivo-prod/public/. _site/
              git worktree remove --force /tmp/lucivo-prod
            fi
          fi

          # 2. Canary（/preview/）を main からビルド
          LUCIVO_VERSION_OVERRIDE="$CANARY_VERSION" node tools/build-app.cjs --prod
          cp -R public/. _site/preview/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
