name: Release

# main の package.json の version に対応するタグ（lucivo-vX.Y.Z）が未作成の場合に、
# タグ作成・スタンドアロン版 ZIP ビルド・GitHub Release 公開を自動実行する（Ref #106）。
on:
  workflow_run:
    workflows: ["Self Approve"]
    types: [completed]
  push:
    branches:
      - main
    paths:
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - name: Check if tag already exists
        id: check
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="lucivo-v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists. Skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} does not exist. Proceeding with release."
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.exists == 'false'
      - name: Build standalone ZIP and create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          TAG: ${{ steps.check.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          BUILD_VERSION="${VERSION} (build #${{ github.run_number }})"
          # スタンドアロン版（dist/）だけをビルドして ZIP にする。GitHub Release に付けるのはこの ZIP 1 つ
          # 公開用 URL の Web 版は、deploy.yml がタグからビルドし直す（doc/2.ARCHITECTURE.md 4.14 ARC-PUB-004・005）
          LUCIVO_VERSION_OVERRIDE="$BUILD_VERSION" node tools/build-app.cjs --prod --channel standalone

          ZIP_DIR="Lucivo-v${VERSION}"
          ZIP_NAME="Lucivo-v${VERSION}.zip"
          rm -rf /tmp/release-pkg
          mkdir -p "/tmp/release-pkg/${ZIP_DIR}"
          cp -R dist/. "/tmp/release-pkg/${ZIP_DIR}/"
          (cd /tmp/release-pkg && zip -rq "$GITHUB_WORKSPACE/${ZIP_NAME}" "${ZIP_DIR}")

          node - <<'EOF'
          const fs = require('fs');
          const readme = fs.readFileSync('README.md', 'utf8');
          const ver = process.env.VERSION;
          const zipName = `Lucivo-v${ver}.zip`;
          const tag = process.env.TAG;
          const repo = process.env.REPO;
          const dlUrl = `https://github.com/${repo}/releases/download/${tag}/${zipName}`;
          const escapedVer = ver.replace(/\./g, '\\.');
          const re = new RegExp(`(^###\\s+${escapedVer}(?:[^\\n]*)\\n[\\s\\S]*?)(?=^###\\s+|^##\\s+|(?![\\s\\S]))`, 'm');
          const m = readme.match(re);
          if (!m) {
            console.error(`Release notes section for ${ver} not found in README.md`);
            process.exit(1);
          }
          const section = m[1].trim();
          const header = [
            '## スタンドアロン版（ZIP）の使い方',
            '',
            `- [**${zipName}**](${dlUrl}) をダウンロードして展開し、\`index.html\` をブラウザで開いてください。`,
            `- ※ 下部の \`Source code (zip / tar.gz)\` は仕様書やテストを含む開発者向けリポジトリ全体です。利用者は必ず **\`${zipName}\`** を選んでください。`,
            '',
            '---',
            ''
          ].join('\n');
          fs.writeFileSync('/tmp/release-notes.md', header + section + '\n', 'utf8');
          EOF

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          # 注釈付きのタグを GitHub Release より先に作る（Release はタグを指すため）。
          # 注釈に埋め込んだ版の表記を書き、deploy.yml が公開用 URL のビルドで読んで ZIP とビルド番号をそろえる
          printf 'Lucivo %s\n\nLUCIVO_VERSION: %s\n' "$VERSION" "$BUILD_VERSION" > /tmp/tag-message.txt
          git tag -a "$TAG" HEAD -F /tmp/tag-message.txt
          git push origin "$TAG"

          gh release create "$TAG" "$ZIP_NAME" --verify-tag --title "Lucivo ${VERSION}" --notes-file /tmp/release-notes.md
