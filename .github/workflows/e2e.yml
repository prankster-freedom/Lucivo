name: E2E Tests
# main へは検証済みのコミットだけが入るため、push では実行しない。
# feature/pre-test は、リリース前に複数の変更をまとめて試すための統合ブランチ。main の履歴を書き換えずに済むよう、そこへの PR でも実行する
on:
  pull_request:
    branches: [ main, feature/pre-test ]
jobs:
  # 壊れた文字列（制御文字、正規表現の中の制御文字、見えない空白）を検出する。ドキュメントも対象なので常に実行する
  lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
  # ワークフローやジョブをスキップすると必須チェック test が待機のままになるため、ステップ単位でスキップする
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - id: filter
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.sha }}
        BEFORE: ${{ github.event.before }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: node tools/check-ci-changes.cjs
  test:
    needs: changes
    # changes の成否にかかわらず test ジョブを実行して必須チェックを満たす
    if: ${{ !cancelled() }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: Skip E2E if only docs changed
      if: ${{ needs.changes.outputs.e2e == 'false' }}
      run: echo "Skipping E2E tests because only documentation was changed."
    - uses: actions/checkout@v7
      if: ${{ needs.changes.outputs.e2e != 'false' }}
    - uses: actions/setup-node@v7
      if: ${{ needs.changes.outputs.e2e != 'false' }}
      with:
        node-version: lts/*
    - name: Install dependencies
      if: ${{ needs.changes.outputs.e2e != 'false' }}
      run: npm ci
    - name: Install Chromium
      if: ${{ needs.changes.outputs.e2e != 'false' }}
      run: npx playwright install --with-deps chromium
    # public/ と dist/ のビルドは npm test の pretest が行う（doc/2.ARCHITECTURE.md 4.14 ARC-PUB-006）
    - name: Run E2E tests
      if: ${{ needs.changes.outputs.e2e != 'false' }}
      run: npm test
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
      with:
        name: e2e-results
        path: work/test/
        retention-days: 30
