<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="sans-serif">
  <title>余白のライト（罫線で区切るか、余白で区切るか）</title>
  <desc>上段はそのままの見え方、下段はぼかした見え方（離れて見たときの代わり）。罫線で区切ったグループはぼかすと区別が消え、余白で区切ったグループはぼかしても分かれて見える。</desc>
  <defs><filter id="b"><feGaussianBlur stdDeviation="4"/></filter></defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <style>.h{font-size:14px;fill:#111;font-weight:bold}.c{font-size:12px;fill:#333}.d{fill:#555}</style>
  <text x="20" y="24" class="h">罫線で区切る</text>
  <text x="400" y="24" class="h">余白で区切る</text>

  <g id="ruled">
    <g class="d">
      <circle cx="40" cy="50" r="6"/><circle cx="60" cy="50" r="6"/><circle cx="40" cy="70" r="6"/><circle cx="60" cy="70" r="6"/>
      <circle cx="100" cy="50" r="6"/><circle cx="120" cy="50" r="6"/><circle cx="140" cy="50" r="6"/><circle cx="160" cy="50" r="6"/>
      <circle cx="100" cy="70" r="6"/><circle cx="120" cy="70" r="6"/><circle cx="140" cy="70" r="6"/><circle cx="160" cy="70" r="6"/>
      <circle cx="40" cy="110" r="6"/><circle cx="60" cy="110" r="6"/><circle cx="80" cy="110" r="6"/><circle cx="100" cy="110" r="6"/><circle cx="120" cy="110" r="6"/><circle cx="140" cy="110" r="6"/><circle cx="160" cy="110" r="6"/>
      <circle cx="40" cy="130" r="6"/><circle cx="60" cy="130" r="6"/><circle cx="80" cy="130" r="6"/><circle cx="100" cy="130" r="6"/><circle cx="120" cy="130" r="6"/><circle cx="140" cy="130" r="6"/><circle cx="160" cy="130" r="6"/>
    </g>
    <line x1="80" y1="40" x2="80" y2="82" stroke="#555" stroke-width="1.5"/>
    <line x1="30" y1="90" x2="170" y2="90" stroke="#555" stroke-width="1.5"/>
  </g>
  <g id="spaced">
    <g class="d">
      <circle cx="420" cy="50" r="6"/><circle cx="440" cy="50" r="6"/><circle cx="420" cy="70" r="6"/><circle cx="440" cy="70" r="6"/>
      <circle cx="500" cy="50" r="6"/><circle cx="520" cy="50" r="6"/><circle cx="540" cy="50" r="6"/><circle cx="560" cy="50" r="6"/>
      <circle cx="500" cy="70" r="6"/><circle cx="520" cy="70" r="6"/><circle cx="540" cy="70" r="6"/><circle cx="560" cy="70" r="6"/>
      <circle cx="420" cy="130" r="6"/><circle cx="440" cy="130" r="6"/><circle cx="460" cy="130" r="6"/><circle cx="480" cy="130" r="6"/><circle cx="500" cy="130" r="6"/><circle cx="520" cy="130" r="6"/><circle cx="540" cy="130" r="6"/>
      <circle cx="420" cy="150" r="6"/><circle cx="440" cy="150" r="6"/><circle cx="460" cy="150" r="6"/><circle cx="480" cy="150" r="6"/><circle cx="500" cy="150" r="6"/><circle cx="520" cy="150" r="6"/><circle cx="540" cy="150" r="6"/>
    </g>
  </g>

  <text x="20" y="200" class="c">↓ ぼかして見る（いつもの数倍離れた距離の代わり）</text>
  <g filter="url(#b)" transform="translate(0,190)"><use href="#ruled"/></g>
  <g filter="url(#b)" transform="translate(0,190)"><use href="#spaced"/></g>
  <text x="20" y="370" class="c">罫線のグループは、ぼかすと 1 つの塊になり、</text><text x="20" y="386" class="c">区切りが分からない。</text>
  <text x="400" y="370" class="c">余白のグループは、ぼかしても</text><text x="400" y="386" class="c">3 つに分かれて見える。</text>
  <text x="20" y="410" font-size="11" fill="#777">書籍の説明（おおまかな空間に反応する見え方）と例をもとに作り直した図。</text>
</svg>
