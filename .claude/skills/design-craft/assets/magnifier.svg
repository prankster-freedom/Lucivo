<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="940" viewBox="0 0 1040 940" font-family="sans-serif">
  <title>虫めがね：視覚の解像度・細部・見た目で考える</title>
  <desc>色と矢印の解像度（低い見方と高い見方）、カタチの細部（点線の切れ目、角丸の内外の半径、現実の光）、見た目で考える 3 例（記号の高さ、行頭の左揃え、図形の大きさ）の見本。書籍の見本をもとに作り直した近似。</desc>
  <defs>
    <filter id="sh1"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#000" flood-opacity="0.8"/></filter>
    <filter id="sh2"><feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/></filter>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#ddd"/><stop offset="1" stop-color="#333"/></radialGradient>
    <radialGradient id="g2" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#eee"/><stop offset="1" stop-color="#333"/></radialGradient>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#c33"/></marker>
  </defs>
  <rect width="1040" height="940" fill="#ffffff"/>
  <style>.h{font-size:15px;fill:#111;font-weight:bold}.c{font-size:12px;fill:#333}.s{font-size:10px;fill:#555}.k{fill:#222}</style>

  <text x="20" y="26" class="h">視覚の解像度を上げる：色（「赤」とひとくくりにしない）</text>
  <text x="20" y="48" class="c">低い</text>
  <circle cx="90" cy="70" r="20" fill="#e8434a"/><circle cx="140" cy="70" r="20" fill="#f2df2e"/><circle cx="190" cy="70" r="20" fill="#2f7fc8"/><circle cx="240" cy="70" r="20" fill="#cfcfcf"/>
  <g class="s"><text x="82" y="104">赤</text><text x="132" y="104">黄</text><text x="182" y="104">青</text><text x="226" y="104">グレー</text></g>
  <text x="300" y="48" class="c">高い（同じ赤・黄・青・グレーでも印象が違う）</text>
  <g transform="translate(300,56)">
    <circle cx="22" cy="18" r="16" fill="#e04a4e"/><text x="22" y="50" font-size="9" fill="#555" text-anchor="middle">ナチュラル</text>
    <circle cx="66" cy="18" r="16" fill="#e8306e"/><text x="66" y="50" font-size="9" fill="#555" text-anchor="middle">ケミカル</text>
    <circle cx="110" cy="18" r="16" fill="#e06a50"/><text x="110" y="50" font-size="9" fill="#555" text-anchor="middle">和風</text>
    <circle cx="154" cy="18" r="16" fill="#c04a58"/><text x="154" y="50" font-size="9" fill="#555" text-anchor="middle">にぶい</text>
    <circle cx="208" cy="18" r="16" fill="#efe04a"/><text x="208" y="50" font-size="9" fill="#555" text-anchor="middle">さわやか</text>
    <circle cx="252" cy="18" r="16" fill="#cde03a"/><text x="252" y="50" font-size="9" fill="#555" text-anchor="middle">シャープ</text>
    <circle cx="296" cy="18" r="16" fill="#f2b84a"/><text x="296" y="50" font-size="9" fill="#555" text-anchor="middle">柔らかい</text>
    <circle cx="340" cy="18" r="16" fill="#f2e48a"/><text x="340" y="50" font-size="9" fill="#555" text-anchor="middle">浅い</text>
    <circle cx="394" cy="18" r="16" fill="#2e3a8a"/><text x="394" y="50" font-size="9" fill="#555" text-anchor="middle">風格</text>
    <circle cx="438" cy="18" r="16" fill="#1a8ad0"/><text x="438" y="50" font-size="9" fill="#555" text-anchor="middle">さわやか</text>
    <circle cx="482" cy="18" r="16" fill="#12a0b8"/><text x="482" y="50" font-size="9" fill="#555" text-anchor="middle">若い</text>
    <circle cx="526" cy="18" r="16" fill="#3a2a8a"/><text x="526" y="50" font-size="9" fill="#555" text-anchor="middle">神秘的</text>
    <circle cx="580" cy="18" r="16" fill="#c8c8c8"/><text x="580" y="50" font-size="9" fill="#555" text-anchor="middle">フラット</text>
    <circle cx="624" cy="18" r="16" fill="#b8c8cc"/><text x="624" y="50" font-size="9" fill="#555" text-anchor="middle">冷たい</text>
    <circle cx="668" cy="18" r="16" fill="#d8c8c0"/><text x="668" y="50" font-size="9" fill="#555" text-anchor="middle">暖かい</text>
    <circle cx="712" cy="18" r="16" fill="#c8c0c8"/><text x="712" y="50" font-size="9" fill="#555" text-anchor="middle">色味あり</text>
  </g>

  <text x="20" y="150" class="h">視覚の解像度を上げる：カタチ（矢印にもディテールは無限にある）</text>
  <text x="20" y="172" class="c">低い</text>
  <g class="k"><path d="M80 230 V190 h-8 l14 -18 l14 18 h-8 v40 z"/><path d="M130 230 V192 h-10 l16 -20 l16 20 h-10 v38 z"/></g>
  <text x="200" y="172" class="c">高い</text>
  <g transform="translate(200,180)" class="k">
    <path d="M20 50 V12 l-8 8 M20 12 l8 8" stroke="#222" stroke-width="2" fill="none"/>
    <path d="M60 50 V10 h-12 l16 -14 l16 14 h-12 v40 z" transform="translate(0,6)"/>
    <path d="M115 20 l12 -16 l12 16 z M115 44 l12 -16 l12 16 z"/>
    <path d="M165 18 l10 -12 l10 12 M165 32 l10 -12 l10 12 M165 46 l10 -12 l10 12" stroke="#222" stroke-width="4" fill="none"/>
    <path d="M220 50 Q220 10 255 12 l-4 -8 l14 12 l-14 10 l4 -8 Q232 18 232 50 z"/>
    <circle cx="305" cy="26" r="22"/><path d="M305 40 V16 m-8 8 l8 -8 l8 8" stroke="#fff" stroke-width="3" fill="none"/>
    <rect x="345" y="4" width="44" height="44"/><path d="M367 40 V14 m-8 8 l8 -8 l8 8" stroke="#fff" stroke-width="3" fill="none"/>
    <path d="M410 50 Q420 30 415 14 M410 14 l5 -8 l5 8" stroke="#222" stroke-width="1.5" fill="none"/>
    <path d="M455 50 v-26 h6 v-14 a4 4 0 0 1 8 0 v14 h8 a4 4 0 0 1 4 4 v22 z" fill="#fff" stroke="#222" stroke-width="2"/>
  </g>
  <g class="s"><text x="210" y="248">線</text><text x="250" y="248">安定</text><text x="312" y="248">先端だけ</text><text x="414" y="248">曲がった</text><text x="490" y="248">ボタン（円・四角）</text><text x="604" y="248">手描き</text><text x="650" y="248">指さす手</text></g>

  <text x="20" y="300" class="h">神は細部に宿る：カタチの細部</text>
  <g transform="translate(20,315)">
    <text x="0" y="12" class="c">点線の切れ目を整える</text>
    <rect x="0" y="22" width="70" height="70" fill="none" stroke="#222" stroke-dasharray="9 5"/>
    <text x="0" y="108" class="s">× 角で線が切れる</text>
    <path d="M90 22 h70 v70 h-70 z" fill="none" stroke="#222" stroke-dasharray="9 5" stroke-dashoffset="4.5" pathLength="280"/>
    <g stroke="#222" stroke-width="1"><line x1="90" y1="22" x2="99" y2="22"/><line x1="151" y1="22" x2="160" y2="22"/><line x1="160" y1="22" x2="160" y2="31"/><line x1="160" y1="83" x2="160" y2="92"/><line x1="160" y1="92" x2="151" y2="92"/><line x1="99" y1="92" x2="90" y2="92"/><line x1="90" y1="92" x2="90" y2="83"/><line x1="90" y1="31" x2="90" y2="22"/></g>
    <text x="90" y="108" class="s">○ 角を揃える</text>
  </g>
  <g transform="translate(290,315)">
    <text x="0" y="12" class="c">角の丸みを揃える（角丸を内外に重ねる）</text>
    <path d="M10 100 V50 a25 25 0 0 1 25 -25 H100" fill="none" stroke="#222" stroke-width="3"/>
    <path d="M22 100 V50 a25 25 0 0 1 25 -25" fill="none" stroke="#222" stroke-width="3" transform="translate(0,12)"/>
    <text x="0" y="122" class="s">× 内外とも同じ半径</text><text x="0" y="136" class="s">→ 揃って見えない</text>
    <path d="M190 100 V50 a25 25 0 0 1 25 -25 H280" fill="none" stroke="#222" stroke-width="3"/>
    <path d="M202 100 V50 a13 13 0 0 1 13 -13 H280" fill="none" stroke="#222" stroke-width="3"/>
    <text x="180" y="122" class="s">○ 内側の半径を小さく</text><text x="180" y="136" class="s">（外 25・内 13）</text>
  </g>
  <g transform="translate(650,315)">
    <text x="0" y="12" class="c">現実の光を意識する（影とグラデーション）</text>
    <text x="10" y="80" font-size="44" font-weight="bold" fill="#333" filter="url(#sh1)">SH</text>
    <text x="10" y="110" class="s">× 影が濃く、ぼかしが大きい</text><text x="10" y="124" class="s">→ 嘘っぽい</text>
    <text x="200" y="80" font-size="44" font-weight="bold" fill="#333" filter="url(#sh2)">SH</text>
    <text x="200" y="110" class="s">○ 光の向きと強さに合わせる</text>
    <circle cx="40" cy="160" r="26" fill="url(#g1)"/><text x="10" y="200" class="s">× 光源のない中心</text>
    <circle cx="230" cy="160" r="26" fill="url(#g2)"/><text x="200" y="200" class="s">○ 左上からの光</text>
  </g>

  <text x="20" y="560" class="h">見た目で考える（データに委ねず、目で決める）</text>
  <g transform="translate(20,575)">
    <text x="0" y="12" class="c">見た目の中央：記号の高さ</text>
    <text x="0" y="60" font-size="40" fill="#222">12:45</text><text x="0" y="110" font-size="40" fill="#222">03-123</text>
    <text x="0" y="132" class="s">データのまま</text><text x="0" y="146" class="s">（: と - が下がって見える）</text>
    <text x="170" y="60" font-size="40" fill="#222">12<tspan dy="-4">:</tspan><tspan dy="4">45</tspan></text>
    <text x="170" y="110" font-size="40" fill="#222">03<tspan dy="-4">-</tspan><tspan dy="4">123</tspan></text>
    <text x="170" y="132" class="s">記号を少し上げて、</text><text x="170" y="146" class="s">見た目で揃える</text>
  </g>
  <g transform="translate(400,575)">
    <text x="0" y="12" class="c">見た目の左揃え：行頭の文字のカタチ</text>
    <line x1="4" y1="22" x2="4" y2="112" stroke="#c33"/>
    <text x="4" y="60" font-size="34" fill="#222">漢字で始</text><text x="4" y="104" font-size="34" fill="#222">カタカナ</text>
    <text x="0" y="132" class="s">データで左揃え</text><text x="0" y="146" class="s">（カタカナが右に見える）</text>
    <line x1="194" y1="22" x2="194" y2="112" stroke="#c33"/>
    <text x="194" y="60" font-size="34" fill="#222">漢字で始</text><text x="190" y="104" font-size="34" fill="#222">カタカナ</text>
    <text x="190" y="132" class="s">カタカナの行を</text><text x="190" y="146" class="s">少し左へ</text>
  </g>
  <g transform="translate(760,575)">
    <text x="0" y="12" class="c">見た目の同じサイズ：図形</text>
    <g class="k"><rect x="0" y="40" width="40" height="40"/><path d="M50 80 L70 40 L90 80 z"/><circle cx="120" cy="60" r="20"/><path d="M160 40 L180 60 L160 80 L140 60 z"/></g>
    <line x1="0" y1="40" x2="190" y2="40" stroke="#c33" stroke-dasharray="3 2"/><line x1="0" y1="80" x2="190" y2="80" stroke="#c33" stroke-dasharray="3 2"/>
    <text x="0" y="100" class="s">数値で同じ高さ（△○◇が小さく見える）</text>
    <g class="k" transform="translate(0,90)"><rect x="0" y="42" width="40" height="40"/><path d="M47 88 L70 36 L93 88 z"/><circle cx="120" cy="62" r="23"/><path d="M162 36 L188 62 L162 88 L136 62 z"/></g>
    <text x="0" y="198" class="s">□ を基準に、△○◇ を少し大きくする</text>
  </g>
  <text x="20" y="900" font-size="11" fill="#777">書籍の見本（第 2 章「虫めがね」）をもとに作り直した近似。色の値と書体は近似。</text>
</svg>
