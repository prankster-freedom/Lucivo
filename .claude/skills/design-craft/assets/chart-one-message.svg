<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="sans-serif">
  <title>1 つのグラフに 1 つのメッセージ</title>
  <desc>左は全データを 1 枚に重ねた複合グラフ（惜しい例）。右はメッセージごとに分けた 4 枚のグラフ（正解の例）。メッセージを見出しにし、比較したいことに合う種類を選ぶ。</desc>
  <rect width="1000" height="560" fill="#ffffff"/>
  <style>.h{font-size:14px;fill:#111;font-weight:bold}.c{font-size:12px;fill:#222}.s{font-size:10px;fill:#555}.ax{stroke:#666}.b1{fill:#4bb3c9}.b2{fill:#f08a3c}.ln{stroke:#d33;stroke-width:2;fill:none}</style>

  <text x="20" y="26" class="h">△ 惜しい：全データを 1 枚に入れると読み取りにくい</text>
  <rect x="20" y="40" width="380" height="300" fill="#fafafa" stroke="#ccc"/>
  <text x="30" y="60" class="c">レストランの売上状況（時間帯別）</text>
  <line x1="50" y1="310" x2="390" y2="310" class="ax"/><line x1="50" y1="80" x2="50" y2="310" class="ax"/>
  <g>
    <rect x="60" y="270" width="16" height="40" class="b2"/><rect x="85" y="230" width="16" height="80" class="b2"/><rect x="85" y="220" width="16" height="10" class="b1"/><rect x="110" y="235" width="16" height="75" class="b2"/>
    <rect x="135" y="280" width="16" height="30" class="b1"/><rect x="160" y="292" width="16" height="18" class="b1"/><rect x="185" y="296" width="16" height="14" class="b1"/>
    <rect x="210" y="285" width="16" height="25" class="b1"/><rect x="235" y="250" width="16" height="45" class="b1"/><rect x="235" y="240" width="16" height="10" class="b2"/>
    <rect x="260" y="190" width="16" height="120" class="b1"/><rect x="260" y="160" width="16" height="30" class="b2"/>
    <rect x="285" y="120" width="16" height="190" class="b1"/><rect x="285" y="90" width="16" height="30" class="b2"/>
    <rect x="310" y="200" width="16" height="110" class="b1"/><rect x="310" y="185" width="16" height="15" class="b2"/><rect x="335" y="270" width="16" height="40" class="b1"/>
  </g>
  <polyline points="68,250 93,150 118,170 143,240 168,262 193,268 218,250 243,230 268,170 293,110 318,200 343,250" class="ln"/>
  <text x="30" y="332" class="s">棒（2 種の売上）と折れ線（来客数）が重なり、何を見ればよいか分からない</text>

  <text x="430" y="26" class="h">◎ 正解：メッセージを決めて、1 枚に 1 つ</text>
  <!-- 1 -->
  <rect x="430" y="40" width="270" height="230" fill="#fafafa" stroke="#ccc"/>
  <text x="440" y="60" class="c">ディナーの売上はランチの 4.6 倍</text>
  <rect x="480" y="200" width="50" height="40" fill="#4bb3c9"/><rect x="590" y="80" width="50" height="160" fill="#d63a6a"/>
  <line x1="530" y1="200" x2="590" y2="80" stroke="#888" stroke-dasharray="3 2"/><text x="545" y="130" class="c">4.6 倍</text>
  <text x="480" y="256" class="s">ランチ</text><text x="590" y="256" class="s">ディナー</text>
  <!-- 2 -->
  <rect x="715" y="40" width="270" height="230" fill="#fafafa" stroke="#ccc"/>
  <text x="725" y="60" class="c">カフェの売上はランチの 1/3、</text><text x="725" y="76" class="c">客単価はほぼ同じ</text>
  <rect x="745" y="90" width="30" height="150" class="b1"/><rect x="780" y="190" width="30" height="50" class="b2"/>
  <rect x="860" y="150" width="30" height="90" class="b1"/><rect x="895" y="160" width="30" height="80" class="b2"/>
  <rect x="900" y="88" width="10" height="10" class="b1"/><text x="914" y="97" class="s">ランチ</text>
  <rect x="900" y="104" width="10" height="10" class="b2"/><text x="914" y="113" class="s">カフェ</text>
  <text x="755" y="256" class="s">売上</text><text x="870" y="256" class="s">客単価</text>
  <!-- 3 -->
  <rect x="430" y="290" width="270" height="230" fill="#fafafa" stroke="#ccc"/>
  <text x="440" y="310" class="c">来客のピークは 13 時台と 19 時台</text>
  <polyline points="450,470 480,380 510,440 540,480 570,470 600,430 630,340 660,430 690,470" class="ln"/>
  <circle cx="480" cy="380" r="4" fill="#d33"/><text x="470" y="370" class="s">36 組</text>
  <circle cx="630" cy="340" r="4" fill="#d33"/><text x="620" y="330" class="s">45 組</text>
  <text x="470" y="506" class="s">13:00</text><text x="620" y="506" class="s">19:00</text>
  <!-- 4 -->
  <rect x="715" y="290" width="270" height="230" fill="#fafafa" stroke="#ccc"/>
  <text x="725" y="310" class="c">ランチは 9 割近くがセットを頼む</text>
  <circle cx="850" cy="420" r="70" fill="#f08a3c"/>
  <path d="M850 420 L850 350 A70 70 0 0 0 795 377 Z" fill="#4bb3c9"/>
  <text x="870" y="440" class="c" fill="#fff">セット 87%</text><text x="770" y="368" class="s">単品 13%</text>

  <text x="20" y="380" class="h">グラフの選び方（比較したいこと → 種類）</text>
  <text x="20" y="406" class="c">割合（割合・%）→ 円グラフ</text>
  <text x="20" y="430" class="c">項目の大小（多い・低い）→ 横棒グラフ</text>
  <text x="20" y="454" class="c">時系列の増減（減少・増加）→ 縦棒グラフ</text>
  <text x="20" y="478" class="c">分布（集中・範囲）→ 折れ線グラフ</text>
  <text x="20" y="530" font-size="11" fill="#777">書籍の見本（第 3 章、レストランの売上の例）をもとに作り直した図。数値は見本による。</text>
</svg>
