<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="900" viewBox="0 0 1040 900" font-family="sans-serif">
  <title>擬人化力：組み・配置・あしらい・色を人に例える</title>
  <desc>上から、組みを話し方に（字間・行間・行の長さの違い）、配置を人々の立ち方に（整列・ゆるい並び・主役と脇役・群れ）、同じ文字のあしらいを服装とメイクに（5 種）、色を年代に（4 種）例えた見本。書籍の見本をもとに作り直した近似で、書体は端末にあるもので代用している。</desc>
  <defs>
    <pattern id="hb" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12 L6 0 L12 12" fill="none" stroke="#b8a98c" stroke-width="2"/></pattern>
    <pattern id="dot" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#9ab"/></pattern>
    <linearGradient id="gal" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f6c"/><stop offset="1" stop-color="#fdd"/></linearGradient>
  </defs>
  <rect width="1040" height="900" fill="#ffffff"/>
  <style>.h{font-size:15px;fill:#111;font-weight:bold}.c{font-size:12px;fill:#333}.s{font-size:11px;fill:#555}.p{fill:#555}</style>

  <text x="20" y="26" class="h">組みを話し方に（字間・行間＝話すスピード、行の長さ＝話すリズム）</text>
  <g font-size="11" fill="#333">
    <text x="20" y="50">1 行が長く行間も狭い組みは、話が</text>
    <text x="20" y="63">長く少し単調な講義のように聞こえ</text>
    <text x="20" y="76">る。重厚で落ち着くが、行が長いほど</text>
    <text x="20" y="89">視線の移動が増え、重さが出る。</text>
    <text x="20" y="110" class="s">大学教授の講義</text>
  </g>
  <g font-size="12" fill="#333" letter-spacing="4">
    <text x="300" y="52">むかし　むかし</text>
    <text x="300" y="80">ある　ところに</text>
    <text x="300" y="108" class="s" letter-spacing="0">保育士さんの読み聞かせ（字間・行間が広い）</text>
  </g>
  <g font-size="12" fill="#333">
    <text x="560" y="50">● 課題：来店が 13 時に集中</text>
    <text x="560" y="68">● 原因：ランチの席数が不足</text>
    <text x="560" y="86">● 対策：予約枠を設ける</text>
    <text x="560" y="108" class="s">プレゼンの理路整然としたトーク（整然と揃う）</text>
  </g>
  <g font-size="12" fill="#333">
    <text x="830" y="48">ねえ聞いて</text><text x="830" y="63">それでね</text><text x="830" y="78">うそー</text><text x="830" y="93">ほんとに</text>
    <text x="830" y="110" class="s">女性同士のおしゃべり（短い行）</text>
  </g>

  <text x="20" y="150" class="h">配置を人々の立ち方に（同じ要素でも、置き方でキャラが変わる）</text>
  <g transform="translate(20,165)">
    <rect width="230" height="140" fill="#f7f7f7"/>
    <g class="p"><rect x="30" y="40" width="30" height="70"/><rect x="80" y="40" width="30" height="70"/><rect x="130" y="40" width="30" height="70"/><rect x="180" y="40" width="30" height="70"/></g>
    <text x="0" y="160" class="c">1 整列：朝礼のサラリーマン</text><text x="0" y="176" class="s">等間隔で列を乱さない。真面目、硬い</text>
  </g>
  <g transform="translate(275,165)">
    <rect width="230" height="140" fill="#f7f7f7"/>
    <g class="p"><rect x="20" y="50" width="28" height="60" transform="rotate(-6 34 80)"/><rect x="85" y="35" width="28" height="70"/><rect x="125" y="60" width="28" height="55" transform="rotate(8 139 87)"/><rect x="180" y="45" width="28" height="65" transform="rotate(-3 194 77)"/></g>
    <text x="0" y="160" class="c">2 ゆるい並び：ラフに立つ人々</text><text x="0" y="176" class="s">間隔も向きもばらばら。肩の力が抜けた</text>
  </g>
  <g transform="translate(530,165)">
    <rect width="230" height="140" fill="#f7f7f7"/>
    <rect x="20" y="15" width="70" height="120" fill="#444"/>
    <g class="p"><rect x="150" y="70" width="14" height="32"/><rect x="180" y="74" width="12" height="28"/></g>
    <text x="0" y="160" class="c">3 主役と脇役：存在感のある主役</text><text x="0" y="176" class="s">大きく手前に主役、遠くに小さく脇役</text>
  </g>
  <g transform="translate(785,165)">
    <rect width="230" height="140" fill="#f7f7f7"/>
    <g class="p">
      <rect x="20" y="30" width="10" height="22" transform="rotate(30 25 41)"/><rect x="50" y="70" width="10" height="22" transform="rotate(-40 55 81)"/><rect x="80" y="20" width="10" height="22" transform="rotate(60 85 31)"/><rect x="110" y="90" width="10" height="22" transform="rotate(10 115 101)"/><rect x="140" y="40" width="10" height="22" transform="rotate(-70 145 51)"/><rect x="170" y="80" width="10" height="22" transform="rotate(45 175 91)"/><rect x="200" y="30" width="10" height="22" transform="rotate(-20 205 41)"/><rect x="40" y="105" width="10" height="22" transform="rotate(80 45 116)"/><rect x="95" y="55" width="10" height="22" transform="rotate(-10 100 66)"/><rect x="190" y="105" width="10" height="22" transform="rotate(25 195 116)"/><rect x="155" y="105" width="10" height="22" transform="rotate(-55 160 116)"/><rect x="60" y="35" width="10" height="22" transform="rotate(5 65 46)"/>
    </g>
    <text x="0" y="160" class="c">4 群れ：スクランブル交差点</text><text x="0" y="176" class="s">多数の要素が多方向に行き交う。にぎわい</text>
  </g>

  <text x="20" y="390" class="h">あしらいを服装とメイクに（同じ文字「MAKE &amp; FASHION」を 5 通りに）</text>
  <g transform="translate(20,405)">
    <rect width="190" height="110" fill="#fff" stroke="#eee"/>
    <line x1="20" y1="22" x2="170" y2="22" stroke="#333" stroke-width="2"/><line x1="20" y1="88" x2="170" y2="88" stroke="#333" stroke-width="2"/>
    <text x="95" y="52" text-anchor="middle" font-family="serif" font-size="22" fill="#222" letter-spacing="1">MAKE &amp;</text><text x="95" y="78" text-anchor="middle" font-family="serif" font-size="22" fill="#222">FASHION</text>
    <text x="0" y="132" class="c">モードなオシャレ女子</text><text x="0" y="148" class="s">細いセリフ体＋上下の細い罫線</text>
  </g>
  <g transform="translate(225,405)">
    <rect width="190" height="110" fill="url(#hb)"/><rect width="190" height="110" fill="#e9dfc8" opacity="0.55"/>
    <text x="95" y="52" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="22" fill="#6b4a4a">MAKE &amp;</text><text x="95" y="80" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="22" fill="#6b4a4a">FASHION</text>
    <text x="0" y="132" class="c">自然を愛する女子</text><text x="0" y="148" class="s">布（ヘリンボーン）の質感の地</text>
  </g>
  <g transform="translate(430,405)">
    <rect width="190" height="110" fill="#fff"/>
    <circle cx="12" cy="12" r="12" fill="#e47d9a"/><circle cx="178" cy="98" r="12" fill="#e47d9a"/><circle cx="28" cy="6" r="7" fill="#7a5a7a"/><circle cx="165" cy="104" r="7" fill="#7a5a7a"/>
    <rect x="25" y="18" width="140" height="74" fill="#fff" stroke="#c8a96a" stroke-width="2"/>
    <text x="95" y="50" text-anchor="middle" font-family="cursive, serif" font-style="italic" font-size="22" fill="#333">Make &amp;</text><text x="95" y="78" text-anchor="middle" font-family="cursive, serif" font-style="italic" font-size="22" fill="#333">Fashion</text>
    <text x="0" y="132" class="c">育ちの良いお嬢様</text><text x="0" y="148" class="s">筆記体＋花のイラスト＋金の額縁</text>
  </g>
  <g transform="translate(635,405)">
    <rect width="190" height="110" fill="#fff"/>
    <g fill="#c9a"><circle cx="30" cy="16" r="4"/><circle cx="45" cy="16" r="4"/><circle cx="60" cy="16" r="4"/><circle cx="75" cy="16" r="4"/><circle cx="90" cy="16" r="4"/><circle cx="105" cy="16" r="4"/><circle cx="120" cy="16" r="4"/><circle cx="135" cy="16" r="4"/><circle cx="150" cy="16" r="4"/><circle cx="165" cy="16" r="4"/>
    <circle cx="30" cy="96" r="4"/><circle cx="45" cy="96" r="4"/><circle cx="60" cy="96" r="4"/><circle cx="75" cy="96" r="4"/><circle cx="90" cy="96" r="4"/><circle cx="105" cy="96" r="4"/><circle cx="120" cy="96" r="4"/><circle cx="135" cy="96" r="4"/><circle cx="150" cy="96" r="4"/><circle cx="165" cy="96" r="4"/></g>
    <text x="95" y="52" text-anchor="middle" font-weight="bold" font-size="22" fill="url(#gal)" stroke="#e8a" stroke-width="0.6">MAKE &amp;</text><text x="95" y="80" text-anchor="middle" font-weight="bold" font-size="22" fill="url(#gal)" stroke="#e8a" stroke-width="0.6">FASHION</text>
    <text x="0" y="132" class="c">盛り盛りギャル</text><text x="0" y="148" class="s">キラキラの点の列＋グラデーション</text>
  </g>
  <g transform="translate(840,405)">
    <rect width="190" height="110" fill="#e43"/><rect x="5" y="5" width="180" height="100" fill="#48c"/><rect x="10" y="10" width="170" height="90" fill="url(#dot)"/><rect x="10" y="10" width="170" height="90" fill="#fff" opacity="0.4"/>
    <text x="95" y="52" text-anchor="middle" font-weight="900" font-style="italic" font-size="24" fill="#111">MAKE&amp;</text><text x="95" y="82" text-anchor="middle" font-weight="900" font-style="italic" font-size="24" fill="#111">FASHION</text>
    <text x="0" y="132" class="c">我が道を行く個性派</text><text x="0" y="148" class="s">太い斜体＋網点の地＋二重の色の枠</text>
  </g>

  <text x="20" y="600" class="h">色を年代に（淡く明るい色＝若々しさ、渋く暗い色＝年を重ねた風格。「その時代らしさ」も含む）</text>
  <g transform="translate(20,615)">
    <text x="0" y="12" class="c">こども</text>
    <rect x="0" y="20" width="50" height="50" fill="#7ec8f0"/><rect x="55" y="20" width="50" height="50" fill="#f59ac0"/><rect x="0" y="75" width="50" height="50" fill="#f59a5a"/><rect x="55" y="75" width="50" height="50" fill="#6cc04a"/>
  </g>
  <g transform="translate(270,615)">
    <text x="0" y="12" class="c">高齢者</text>
    <rect x="0" y="20" width="50" height="50" fill="#4a6a8a"/><rect x="55" y="20" width="50" height="50" fill="#8a3a4e"/><rect x="0" y="75" width="50" height="50" fill="#6a4a30"/><rect x="55" y="75" width="50" height="50" fill="#2e5a34"/>
  </g>
  <g transform="translate(520,615)">
    <text x="0" y="12" class="c">60〜70 年代</text>
    <rect x="0" y="20" width="45" height="50" fill="#8a2e38"/><rect x="50" y="20" width="45" height="50" fill="#e0a640"/><rect x="100" y="20" width="45" height="50" fill="#3e9a7a"/>
    <rect x="0" y="75" width="45" height="50" fill="#9cb85a"/><rect x="50" y="75" width="45" height="50" fill="#4a6a7a"/><rect x="100" y="75" width="45" height="50" fill="#e0782a"/>
  </g>
  <g transform="translate(770,615)">
    <text x="0" y="12" class="c">80〜90 年代</text>
    <rect x="0" y="20" width="45" height="50" fill="#1a1a1a"/><rect x="50" y="20" width="45" height="50" fill="#d8202a"/><rect x="100" y="20" width="45" height="50" fill="#e0208a"/>
    <rect x="0" y="75" width="45" height="50" fill="#20a0a0"/><rect x="50" y="75" width="45" height="50" fill="#8ac030"/><rect x="100" y="75" width="45" height="50" fill="#f0d020"/>
  </g>
  <text x="20" y="790" class="c">・こどもは明るく澄んだ色、高齢者は渋くくすんだ色。60〜70 年代は土っぽく温かい中間色、80〜90 年代は黒と鮮やかな原色の組み合わせ。</text>
  <text x="20" y="830" font-size="11" fill="#777">書籍の見本（第 2 章「擬人化力」）をもとに作り直した近似。色の値は印刷物の写真からの近似、書体は端末の代用で、見本の書体とは異なる。</text>
</svg>
