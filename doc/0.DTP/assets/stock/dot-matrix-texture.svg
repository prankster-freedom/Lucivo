<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- AST-110 (Stock): Dot Matrix Texture tile (repeat as background). Monochrome (currentColor). -->
  <!-- 12px pitch = the cell grid of a rounded monospace face. One accent dot per tile breaks the mechanical rhythm (Fluid/Organic). -->
  <circle cx="6" cy="6" r="0.9" fill="currentColor" fill-opacity="0.22"/>
  <circle cx="18" cy="6" r="0.9" fill="currentColor" fill-opacity="0.22"/>
  <circle cx="6" cy="18" r="0.9" fill="currentColor" fill-opacity="0.22"/>
  <circle cx="18" cy="18" r="1.3" fill="currentColor" fill-opacity="0.38"/>
</svg>
