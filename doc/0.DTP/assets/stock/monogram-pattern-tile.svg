<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- AST-111 (Stock): LV Monogram Pattern Tile (repeat as background). Monochrome (currentColor). -->
  <!-- Same stroke construction as the favicon (AST-010), scaled to 0.5 and placed twice on a half-drop grid. -->
  <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.28">
    <g transform="translate(4 4) scale(0.5)">
      <path d="M8 7L8 22A3 3 0 0 0 11 25L18 25"/>
      <path d="M16 13L20.5 22.5A1.5 1.5 0 0 0 23.5 22.5L28 13"/>
    </g>
    <g transform="translate(36 36) scale(0.5)">
      <path d="M8 7L8 22A3 3 0 0 0 11 25L18 25"/>
      <path d="M16 13L20.5 22.5A1.5 1.5 0 0 0 23.5 22.5L28 13"/>
    </g>
  </g>
  <!-- Luminous dots: the brightest point of each mark -->
  <circle cx="8" cy="7.5" r="1" fill="currentColor" fill-opacity="0.5"/>
  <circle cx="40" cy="39.5" r="1" fill="currentColor" fill-opacity="0.5"/>
  <!-- Quiet spacer dots on the empty diagonal -->
  <circle cx="48" cy="16" r="0.8" fill="currentColor" fill-opacity="0.18"/>
  <circle cx="16" cy="48" r="0.8" fill="currentColor" fill-opacity="0.18"/>
</svg>
