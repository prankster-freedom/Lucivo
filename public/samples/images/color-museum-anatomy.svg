<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Color Tone Anatomy">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1422"/>
      <stop offset="100%" stop-color="#172036"/>
    </linearGradient>
    <radialGradient id="glowSpot" cx="0.82" cy="0.24" r="0.38">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="720" height="300" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="0" y="0" width="720" height="300" rx="16" fill="url(#glowSpot)"/>

  <!-- Canvas & Card layer -->
  <rect x="28" y="28" width="400" height="244" rx="12" fill="#121826" stroke="#738295" stroke-width="1.5"/>
  <text x="46" y="54" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">CANVAS (--diag-canvas)</text>

  <rect x="46" y="70" width="364" height="184" rx="10" fill="#2D3548" stroke="#877B8F" stroke-width="1.5"/>
  <text x="64" y="96" fill="#BBCBEE" font-family="system-ui, sans-serif" font-size="13" font-weight="700">CARD SURFACE (--vs-card-bg) + TEXT</text>
  <line x1="64" y1="112" x2="392" y2="112" stroke="#877B8F" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- 4 Base colors -->
  <g font-family="ui-monospace, monospace" font-size="11" font-weight="700">
    <rect x="64" y="130" width="72" height="52" rx="8" fill="#CC6B79" stroke="#725457" stroke-width="1.5"/>
    <text x="100" y="154" text-anchor="middle" fill="#35000D">--vs-c1</text>
    <text x="100" y="170" text-anchor="middle" fill="#35000D" font-size="10">#CC6B79</text>

    <rect x="148" y="130" width="72" height="52" rx="8" fill="#C2A64B" stroke="#907C6D" stroke-width="1.5"/>
    <text x="184" y="154" text-anchor="middle" fill="#281A00">--vs-c2</text>
    <text x="184" y="170" text-anchor="middle" fill="#281A00" font-size="10">#C2A64B</text>

    <rect x="232" y="130" width="72" height="52" rx="8" fill="#549E6A" stroke="#676248" stroke-width="1.5"/>
    <text x="268" y="154" text-anchor="middle" fill="#002003">--vs-c3</text>
    <text x="268" y="170" text-anchor="middle" fill="#002003" font-size="10">#549E6A</text>

    <rect x="316" y="130" width="72" height="52" rx="8" fill="#6389C6" stroke="#63576E" stroke-width="1.5"/>
    <text x="352" y="154" text-anchor="middle" fill="#070E47">--vs-c4</text>
    <text x="352" y="170" text-anchor="middle" fill="#070E47" font-size="10">#6389C6</text>
  </g>

  <!-- Connectors -->
  <path d="M 100 182 L 100 218 L 352 218 L 352 182" fill="none" stroke="#877B8F" stroke-width="2"/>
  <circle cx="100" cy="218" r="4" fill="#F3D56B"/>
  <circle cx="226" cy="218" r="4" fill="#F3D56B"/>
  <circle cx="352" cy="218" r="4" fill="#F3D56B"/>
  <text x="226" y="238" text-anchor="middle" fill="#BBCBEE" font-family="system-ui, sans-serif" font-size="11">EDGE / LINE + GLOW (--vs-glow)</text>

  <!-- Right legend -->
  <g transform="translate(454, 34)" font-family="system-ui, sans-serif">
    <text x="0" y="16" fill="#F8FAFC" font-size="14" font-weight="800">4-Layer Color Structure</text>
    <g transform="translate(0, 38)">
      <rect width="16" height="16" rx="4" fill="#CC6B79"/>
      <text x="26" y="13" fill="#E2E8F0" font-size="12" font-weight="600">Background (Fill)</text>
    </g>
    <g transform="translate(0, 72)">
      <rect width="16" height="16" rx="4" fill="#FFEEEF" stroke="#475569"/>
      <text x="26" y="13" fill="#E2E8F0" font-size="12" font-weight="600">Ink / Text (AA >= 4.5)</text>
    </g>
    <g transform="translate(0, 106)">
      <rect width="16" height="16" rx="4" fill="none" stroke="#877B8F" stroke-width="2.5"/>
      <text x="26" y="13" fill="#E2E8F0" font-size="12" font-weight="600">Border (Card &amp; Node)</text>
    </g>
    <g transform="translate(0, 140)">
      <line x1="0" y1="8" x2="16" y2="8" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
      <text x="26" y="13" fill="#E2E8F0" font-size="12" font-weight="600">Line (Diagram Edge)</text>
    </g>
    <g transform="translate(0, 174)">
      <circle cx="8" cy="8" r="7" fill="#67E8F9" fill-opacity="0.85"/>
      <text x="26" y="13" fill="#E2E8F0" font-size="12" font-weight="600">Glow (Light Accent)</text>
    </g>
    <rect x="0" y="210" width="236" height="28" rx="6" fill="#1E293B" stroke="#475569"/>
    <text x="118" y="228" text-anchor="middle" fill="#67E8F9" font-size="11" font-weight="700">Light + Dark Paired Tokens</text>
  </g>
</svg>
