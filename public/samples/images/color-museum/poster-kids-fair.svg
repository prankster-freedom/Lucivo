<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="つくる日曜日 のポスター（晴天の工作舎）">
  <style>
    .fall { animation: fall linear infinite; }
    .twinkle { animation: twinkle 3.2s ease-in-out infinite; }
    .breathe { animation: breathe 5s ease-in-out infinite; }
    .flicker { animation: flicker 4.5s ease-in-out infinite; }
    .rise { animation: rise 4s ease-out infinite; }
    .scroll { animation: scroll 1.6s linear infinite; }
    .glitch { animation: glitch 3.6s steps(1) infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 40s linear infinite; }
    .drift { animation: drift 9s ease-in-out infinite alternate; }
    @keyframes fall { from { transform: translate(-30px, -720px); } to { transform: translate(60px, 720px); } }
    @keyframes twinkle { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    @keyframes breathe { 0%, 100% { opacity: .3; } 50% { opacity: .75; } }
    @keyframes flicker { 0%, 100% { opacity: 1; } 42% { opacity: .82; } 46% { opacity: .95; } 70% { opacity: .88; } }
    @keyframes rise { 0% { transform: translateY(30px); opacity: 0; } 35% { opacity: .35; } 100% { transform: translateY(-70px); opacity: 0; } }
    @keyframes scroll { from { transform: translateY(-30px); } to { transform: translateY(0); } }
    @keyframes glitch { 0% { opacity: 0; } 88% { opacity: .9; } 92% { opacity: 0; } 95% { opacity: .7; } 97% { opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes drift { from { transform: translateX(-40px); } to { transform: translateX(40px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="edge" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".55"/></filter>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ECF3FB"/><stop offset="1" stop-color="#F7FAFE"/></linearGradient>
  </defs>
  <rect width="1200" height="820" fill="url(#paper)"/>
  <circle cx="1120" cy="60" r="260" fill="#38BDF8" opacity=".18" filter="url(#haze)"/>

  <circle cx="880" cy="360" r="200" fill="#D42A44"/>
  <polygon points="720,720 960,400 1180,720" fill="#E0B414" style="mix-blend-mode:multiply"/>
  <rect class="spin" x="1000" y="140" width="140" height="140" fill="#22A046"/>
  <polyline points="700,180 740,140 780,180 820,140 860,180 900,140" fill="none" stroke="#2266CC" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="twinkle" style="animation-delay:-1.5s" cx="1010" cy="560" r="5" fill="#2266CC" opacity="0.7"/><circle class="twinkle" style="animation-delay:-1.8s" cx="1010" cy="584" r="5" fill="#2266CC" opacity="0.8"/><circle class="twinkle" style="animation-delay:-2.6s" cx="1010" cy="608" r="5" fill="#2266CC" opacity="0.7"/><circle class="twinkle" style="animation-delay:-0.2s" cx="1010" cy="632" r="5" fill="#2266CC" opacity="0.7"/><circle class="twinkle" style="animation-delay:-1.8s" cx="1034" cy="560" r="5" fill="#2266CC" opacity="0.7"/><circle class="twinkle" style="animation-delay:-1.4s" cx="1034" cy="584" r="5" fill="#2266CC" opacity="0.9"/><circle class="twinkle" style="animation-delay:-1.3s" cx="1034" cy="608" r="5" fill="#2266CC" opacity="0.8"/><circle class="twinkle" style="animation-delay:-2s" cx="1034" cy="632" r="5" fill="#2266CC" opacity="0.5"/><circle class="twinkle" style="animation-delay:-0.5s" cx="1058" cy="560" r="5" fill="#2266CC" opacity="0.6"/><circle class="twinkle" style="animation-delay:-1.2s" cx="1058" cy="584" r="5" fill="#2266CC" opacity="0.6"/><circle class="twinkle" style="animation-delay:-1.7s" cx="1058" cy="608" r="5" fill="#2266CC" opacity="0.5"/><circle class="twinkle" style="animation-delay:-1.8s" cx="1058" cy="632" r="5" fill="#2266CC" opacity="0.7"/><circle class="twinkle" style="animation-delay:-1.3s" cx="1082" cy="560" r="5" fill="#2266CC" opacity="0.9"/><circle class="twinkle" style="animation-delay:-2.4s" cx="1082" cy="584" r="5" fill="#2266CC" opacity="0.9"/><circle class="twinkle" style="animation-delay:-1s" cx="1082" cy="608" r="5" fill="#2266CC" opacity="0.8"/><circle class="twinkle" style="animation-delay:-0.8s" cx="1082" cy="632" r="5" fill="#2266CC" opacity="0.4"/><circle class="twinkle" style="animation-delay:-2.2s" cx="1106" cy="560" r="5" fill="#2266CC" opacity="1"/><circle class="twinkle" style="animation-delay:-0.9s" cx="1106" cy="584" r="5" fill="#2266CC" opacity="0.5"/><circle class="twinkle" style="animation-delay:-2.2s" cx="1106" cy="608" r="5" fill="#2266CC" opacity="0.6"/><circle class="twinkle" style="animation-delay:-1.7s" cx="1106" cy="632" r="5" fill="#2266CC" opacity="0.7"/><circle class="twinkle" style="animation-delay:-2.5s" cx="1130" cy="560" r="5" fill="#2266CC" opacity="0.5"/><circle class="twinkle" style="animation-delay:-2.5s" cx="1130" cy="584" r="5" fill="#2266CC" opacity="0.9"/><circle class="twinkle" style="animation-delay:-1.2s" cx="1130" cy="608" r="5" fill="#2266CC" opacity="0.4"/><circle class="twinkle" style="animation-delay:-0.2s" cx="1130" cy="632" r="5" fill="#2266CC" opacity="0.9"/>
  <rect x="24" y="24" width="1152" height="772" rx="10" fill="none" stroke="#9A7E7E" stroke-width="2" opacity=".7"/>
  <text x="80" y="130" font-family="Consolas,'JetBrains Mono',ui-monospace,monospace" font-size="22" letter-spacing="8" fill="#E0B414">KIDS MAKER FAIR</text>
  <text x="76" y="262" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif" font-size="92" font-weight="700" letter-spacing="4" fill="#173B5F">つくる日曜日</text>
  <text x="80" y="330" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP',sans-serif" font-size="30" fill="#173B5F" opacity=".85">紙と木と光で、自分だけの道具をつくろう。</text>
  <rect x="80" y="548" width="92" height="46" rx="23" fill="#22A046" stroke="#6C664C" stroke-width="2"/><text x="126" y="579" text-anchor="middle" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP',sans-serif" font-size="24" font-weight="700" fill="#041F00">工作</text><rect x="186" y="548" width="144" height="46" rx="23" fill="#2266CC" stroke="#8C8196" stroke-width="2"/><text x="258" y="579" text-anchor="middle" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP',sans-serif" font-size="24" font-weight="700" fill="#EDF2FF">入場無料</text><rect x="344" y="548" width="92" height="46" rx="23" fill="#D42A44" stroke="#624645" stroke-width="2"/><text x="390" y="579" text-anchor="middle" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP',sans-serif" font-size="24" font-weight="700" fill="#FFF5F5">親子</text>
  <rect x="80" y="650" width="336" height="12" fill="#D42A44"/><rect x="416" y="650" width="96" height="12" fill="#E0B414"/><rect x="512" y="650" width="48" height="12" fill="#38BDF8"/>
  <text x="80" y="720" font-family="Consolas,'JetBrains Mono',ui-monospace,monospace" font-size="30" letter-spacing="4" fill="#38BDF8">12.07 SUN 10:00</text>
  <rect width="1200" height="820" filter="url(#grain)"/>
</svg>
