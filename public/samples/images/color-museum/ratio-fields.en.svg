<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" role="img" aria-label="Two color fields made of the same three colors in different proportions">
  <style>
    .fall { animation: fall linear infinite; }
    .twinkle { animation: twinkle 3.2s ease-in-out infinite; }
    .breathe { animation: breathe 5s ease-in-out infinite; }
    .flicker { animation: flicker 4.5s ease-in-out infinite; }
    .rise { animation: rise 4s ease-out infinite; }
    .scroll { animation: scroll 1.6s linear infinite; }
    .glitch { animation: glitch 3.6s steps(1) infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 40s linear infinite; }
    .drift { animation: drift 9s ease-in-out infinite alternate; }
    @keyframes fall { from { transform: translate(-30px, -720px); } to { transform: translate(60px, 720px); } }
    @keyframes twinkle { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    @keyframes breathe { 0%, 100% { opacity: .3; } 50% { opacity: .75; } }
    @keyframes flicker { 0%, 100% { opacity: 1; } 42% { opacity: .82; } 46% { opacity: .95; } 70% { opacity: .88; } }
    @keyframes rise { 0% { transform: translateY(30px); opacity: 0; } 35% { opacity: .35; } 100% { transform: translateY(-70px); opacity: 0; } }
    @keyframes scroll { from { transform: translateY(-30px); } to { transform: translateY(0); } }
    @keyframes glitch { 0% { opacity: 0; } 88% { opacity: .9; } 92% { opacity: 0; } 95% { opacity: .7; } 97% { opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes drift { from { transform: translateX(-40px); } to { transform: translateX(40px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="edge" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".55"/></filter>
    <linearGradient id="wall2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D2029"/><stop offset="1" stop-color="#111319"/></linearGradient>
  </defs>
  <rect width="1400" height="700" fill="url(#wall2)"/>
  <ellipse cx="400" cy="40" rx="300" ry="80" fill="#FFF4DE" opacity=".08" filter="url(#haze)"/>
  <ellipse cx="1000" cy="40" rx="300" ry="80" fill="#FFF4DE" opacity=".08" filter="url(#haze)"/>
  <g filter="url(#shadow)"><rect x="140" y="70" width="520" height="440" fill="#231921"/></g>
  <rect x="140" y="70" width="520" height="440" fill="#433540" opacity=".35"/>
  <rect x="164" y="94" width="472" height="225.7" rx="6" fill="#231921" filter="url(#edge)"/><rect x="164" y="333.7" width="472" height="109.2" rx="6" fill="#F2AF5C" filter="url(#edge)"/><rect x="164" y="456.9" width="472" height="29.1" rx="6" fill="#FCD34D" filter="url(#edge)"/>
  <g filter="url(#shadow)"><rect x="740" y="70" width="520" height="440" fill="#231921"/></g>
  <rect x="740" y="70" width="520" height="440" fill="#433540" opacity=".35"/>
  <rect x="764" y="94" width="472" height="123.8" rx="6" fill="#433540" filter="url(#edge)"/><rect x="764" y="231.8" width="472" height="120.1" rx="6" fill="#F2AF5C" filter="url(#edge)"/><rect x="764" y="365.9" width="472" height="120.1" rx="6" fill="#FCD34D" filter="url(#edge)"/>
  <text x="140" y="570" font-family="Consolas,'JetBrains Mono',ui-monospace,monospace" font-size="26" letter-spacing="6" fill="#D9D4C7">A — 70 : 25 : 5</text>
  <text x="140" y="608" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP',sans-serif" font-size="22" fill="#9A968C">The eye knows where to rest</text>
  <text x="740" y="570" font-family="Consolas,'JetBrains Mono',ui-monospace,monospace" font-size="26" letter-spacing="6" fill="#D9D4C7">B — 34 : 33 : 33</text>
  <text x="740" y="608" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP',sans-serif" font-size="22" fill="#9A968C">Three colors compete at equal strength</text>
  <rect width="1400" height="700" filter="url(#grain)"/>
</svg>
