<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="TECH NIGHT のポスター（分光プリズムと黒曜石）">
  <style>
    .fall { animation: fall linear infinite; }
    .twinkle { animation: twinkle 3.2s ease-in-out infinite; }
    .breathe { animation: breathe 5s ease-in-out infinite; }
    .flicker { animation: flicker 4.5s ease-in-out infinite; }
    .rise { animation: rise 4s ease-out infinite; }
    .scroll { animation: scroll 1.6s linear infinite; }
    .glitch { animation: glitch 3.6s steps(1) infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 40s linear infinite; }
    .drift { animation: drift 9s ease-in-out infinite alternate; }
    @keyframes fall { from { transform: translate(-30px, -720px); } to { transform: translate(60px, 720px); } }
    @keyframes twinkle { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    @keyframes breathe { 0%, 100% { opacity: .3; } 50% { opacity: .75; } }
    @keyframes flicker { 0%, 100% { opacity: 1; } 42% { opacity: .82; } 46% { opacity: .95; } 70% { opacity: .88; } }
    @keyframes rise { 0% { transform: translateY(30px); opacity: 0; } 35% { opacity: .35; } 100% { transform: translateY(-70px); opacity: 0; } }
    @keyframes scroll { from { transform: translateY(-30px); } to { transform: translateY(0); } }
    @keyframes glitch { 0% { opacity: 0; } 88% { opacity: .9; } 92% { opacity: 0; } 95% { opacity: .7; } 97% { opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes drift { from { transform: translateX(-40px); } to { transform: translateX(40px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="edge" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".55"/></filter>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1422"/><stop offset="1" stop-color="#2C3548"/></linearGradient>
    <linearGradient id="fadeG" x1="620" y1="0" x2="1180" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#000"/><stop offset=".22" stop-color="#fff"/><stop offset=".9" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
    <mask id="gridFade"><rect x="620" y="100" width="560" height="700" fill="url(#fadeG)"/></mask>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#67E8F9"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <mask id="sunMask"><rect x="700" y="240" width="460" height="400" fill="#fff"/><rect x="700" y="470" width="460" height="4" fill="#000"/><rect x="700" y="500" width="460" height="7" fill="#000"/><rect x="700" y="526" width="460" height="10" fill="#000"/><rect x="700" y="548" width="460" height="13" fill="#000"/></mask>
  </defs>
  <rect width="1200" height="820" fill="url(#paper)"/>
  <circle cx="1120" cy="60" r="260" fill="#67E8F9" opacity=".18" filter="url(#haze)"/>

  <clipPath id="gridClip"><rect x="620" y="100" width="560" height="690"/></clipPath>
  <g clip-path="url(#gridClip)" mask="url(#gridFade)">
    <circle class="breathe" cx="930" cy="440" r="240" fill="#F472B6" opacity=".35" filter="url(#haze)"/>
    <circle cx="930" cy="430" r="170" fill="url(#sunGrad)" mask="url(#sunMask)"/>
    <rect x="620" y="560" width="560" height="240" fill="#0E1422" opacity=".85"/>
    <line x1="930" y1="560" x2="520" y2="820" stroke="#38BDF8" stroke-width="2" opacity=".7"/><line x1="930" y1="560" x2="584" y2="820" stroke="#38BDF8" stroke-width="2" opacity=".7"/><line x1="930" y1="560" x2="648" y2="820" stroke="#38BDF8" stroke-width="2" opacity=".7"/><line x1="930" y1="560" x2="712" y2="820" stroke="#38BDF8" stroke-width="2" opacity=".7"/><line x1="930" y1="560" x2="776" y2="820" stroke="#38BDF8" stroke-width="2" opacity=".7"/><line x1="930" y1="560" x2="840" y2="820" stroke="#38BDF8" stroke-width="2" opacity=".7"/><line x1="930" y1="560" x2="904" y2="820" stroke="#38BDF8" stroke-width="2" opacity=".7"/><line x1="930" y1="560" x2="968" y2="820" stroke="#38BDF8" stroke-width="2" opacity=".7"/><line x1="930" y1="560" x2="1032" y2="820" stroke="#38BDF8" stroke-width="2" opacity=".7"/><line x1="930" y1="560" x2="1096" y2="820" stroke="#38BDF8" stroke-width="2" opacity=".7"/><line x1="930" y1="560" x2="1160" y2="820" stroke="#38BDF8" stroke-width="2" opacity=".7"/><line x1="930" y1="560" x2="1224" y2="820" stroke="#38BDF8" stroke-width="2" opacity=".7"/><line x1="930" y1="560" x2="1288" y2="820" stroke="#38BDF8" stroke-width="2" opacity=".7"/><clipPath id="floorClip"><rect x="620" y="562" width="560" height="240"/></clipPath><g clip-path="url(#floorClip)"><g class="scroll"><line x1="620" y1="566" x2="1180" y2="566" stroke="#38BDF8" stroke-width="2" opacity=".7"/><line x1="620" y1="580" x2="1180" y2="580" stroke="#38BDF8" stroke-width="2" opacity=".7"/><line x1="620" y1="598" x2="1180" y2="598" stroke="#38BDF8" stroke-width="2" opacity=".7"/><line x1="620" y1="622" x2="1180" y2="622" stroke="#38BDF8" stroke-width="2" opacity=".7"/><line x1="620" y1="654" x2="1180" y2="654" stroke="#38BDF8" stroke-width="2" opacity=".7"/><line x1="620" y1="696" x2="1180" y2="696" stroke="#38BDF8" stroke-width="2" opacity=".7"/><line x1="620" y1="750" x2="1180" y2="750" stroke="#38BDF8" stroke-width="2" opacity=".7"/><line x1="620" y1="820" x2="1180" y2="820" stroke="#38BDF8" stroke-width="2" opacity=".7"/></g></g>
    <rect class="glitch" style="animation-delay:-0.3s" x="692.8" y="377.6" width="47.5" height="4.9" fill="#38BDF8"/><rect class="glitch" style="animation-delay:-1.8s" x="1117.6" y="447.4" width="20.8" height="7.3" fill="#38BDF8"/><rect class="glitch" style="animation-delay:-0.3s" x="1133" y="452.2" width="62.5" height="7.4" fill="#38BDF8"/><rect class="glitch" style="animation-delay:-1.6s" x="974.5" y="504.8" width="39.2" height="8.1" fill="#38BDF8"/><rect class="glitch" style="animation-delay:-0.7s" x="1035.9" y="206.6" width="84.4" height="5.2" fill="#F472B6"/><rect class="glitch" style="animation-delay:-3.4s" x="1027.2" y="472.1" width="102.2" height="6.9" fill="#F472B6"/><rect class="glitch" style="animation-delay:-2.6s" x="764.3" y="261.9" width="66.6" height="8.4" fill="#F472B6"/><rect class="glitch" style="animation-delay:-2.9s" x="969.7" y="264.6" width="101.7" height="4.2" fill="#38BDF8"/><rect class="glitch" style="animation-delay:-2.9s" x="737.4" y="394.8" width="100.7" height="7.7" fill="#38BDF8"/>
  </g>
  <rect x="24" y="24" width="1152" height="772" rx="10" fill="none" stroke="#738295" stroke-width="2" opacity=".7"/>
  <text x="80" y="130" font-family="Consolas,'JetBrains Mono',ui-monospace,monospace" font-size="22" letter-spacing="8" fill="#F472B6">TECH NIGHT 2026</text>
  <text x="76" y="262" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif" font-size="78" font-weight="700" letter-spacing="4" fill="#C8D8F9">TECH NIGHT</text>
  <text x="80" y="330" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP',sans-serif" font-size="30" fill="#C8D8F9" opacity=".85">ライトニングトーク 8 本と、深夜のデモ大会。</text>
  <rect x="80" y="548" width="70" height="46" rx="23" fill="#A78BFA" stroke="#646D85" stroke-width="2"/><text x="115" y="579" text-anchor="middle" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP',sans-serif" font-size="24" font-weight="700" fill="#190843">LT</text><rect x="164" y="548" width="92" height="46" rx="23" fill="#34D399" stroke="#698787" stroke-width="2"/><text x="210" y="579" text-anchor="middle" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP',sans-serif" font-size="24" font-weight="700" fill="#002219">デモ</text><rect x="270" y="548" width="144" height="46" rx="23" fill="#38BDF8" stroke="#6E8492" stroke-width="2"/><text x="342" y="579" text-anchor="middle" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP',sans-serif" font-size="24" font-weight="700" fill="#001B29">配信あり</text>
  <rect x="80" y="650" width="336" height="12" fill="#38BDF8"/><rect x="416" y="650" width="96" height="12" fill="#F472B6"/><rect x="512" y="650" width="48" height="12" fill="#67E8F9"/>
  <text x="80" y="720" font-family="Consolas,'JetBrains Mono',ui-monospace,monospace" font-size="30" letter-spacing="4" fill="#67E8F9">02.20 FRI 19:00</text>
  <rect width="1200" height="820" filter="url(#grain)"/>
</svg>
