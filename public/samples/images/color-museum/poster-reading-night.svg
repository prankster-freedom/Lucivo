<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="夜の読書会 のポスター（夜を編む図書館）">
  <style>
    .fall { animation: fall linear infinite; }
    .twinkle { animation: twinkle 3.2s ease-in-out infinite; }
    .breathe { animation: breathe 5s ease-in-out infinite; }
    .flicker { animation: flicker 4.5s ease-in-out infinite; }
    .rise { animation: rise 4s ease-out infinite; }
    .scroll { animation: scroll 1.6s linear infinite; }
    .glitch { animation: glitch 3.6s steps(1) infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 40s linear infinite; }
    .drift { animation: drift 9s ease-in-out infinite alternate; }
    @keyframes fall { from { transform: translate(-30px, -720px); } to { transform: translate(60px, 720px); } }
    @keyframes twinkle { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    @keyframes breathe { 0%, 100% { opacity: .3; } 50% { opacity: .75; } }
    @keyframes flicker { 0%, 100% { opacity: 1; } 42% { opacity: .82; } 46% { opacity: .95; } 70% { opacity: .88; } }
    @keyframes rise { 0% { transform: translateY(30px); opacity: 0; } 35% { opacity: .35; } 100% { transform: translateY(-70px); opacity: 0; } }
    @keyframes scroll { from { transform: translateY(-30px); } to { transform: translateY(0); } }
    @keyframes glitch { 0% { opacity: 0; } 88% { opacity: .9; } 92% { opacity: 0; } 95% { opacity: .7; } 97% { opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes drift { from { transform: translateX(-40px); } to { transform: translateX(40px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="edge" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".55"/></filter>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121826"/><stop offset="1" stop-color="#2D3548"/></linearGradient>
  </defs>
  <rect width="1200" height="820" fill="url(#paper)"/>
  <circle cx="1120" cy="60" r="260" fill="#F3D56B" opacity=".18" filter="url(#haze)"/>

  <path d="M770,720 V360 A180,180 0 0 1 1130,360 V720 Z" fill="#6389C6" opacity=".28"/>
  <path d="M770,720 V360 A180,180 0 0 1 1130,360 V720 Z" fill="none" stroke="#C2A64B" stroke-width="3" opacity=".7"/>
  <line x1="950" y1="180" x2="950" y2="720" stroke="#C2A64B" stroke-width="2" opacity=".35"/>
  <circle class="breathe" cx="950" cy="330" r="150" fill="#F3D56B" opacity=".35" filter="url(#haze)"/>
  <circle class="flicker" cx="950" cy="330" r="30" fill="#F3D56B"/>
  <rect x="760" y="593" width="22" height="127" rx="3" fill="#549E6A"/><rect x="764" y="611" width="14" height="4" fill="#121826" opacity=".35"/><rect x="786" y="552" width="33" height="168" rx="3" fill="#CC6B79"/><rect x="790" y="570" width="25" height="4" fill="#121826" opacity=".35"/><rect x="823" y="513" width="34" height="207" rx="3" fill="#CC6B79"/><rect x="827" y="531" width="26" height="4" fill="#121826" opacity=".35"/><rect x="861" y="538" width="38" height="182" rx="3" fill="#C2A64B"/><rect x="865" y="556" width="30" height="4" fill="#121826" opacity=".35"/><rect x="903" y="536" width="28" height="184" rx="3" fill="#6389C6"/><rect x="907" y="554" width="20" height="4" fill="#121826" opacity=".35"/><rect x="935" y="495" width="27" height="225" rx="3" fill="#CC6B79"/><rect x="939" y="513" width="19" height="4" fill="#121826" opacity=".35"/><rect x="966" y="566" width="25" height="154" rx="3" fill="#6389C6"/><rect x="970" y="584" width="17" height="4" fill="#121826" opacity=".35"/><rect x="995" y="491" width="23" height="229" rx="3" fill="#549E6A"/><rect x="999" y="509" width="15" height="4" fill="#121826" opacity=".35"/><rect x="1022" y="485" width="36" height="235" rx="3" fill="#6389C6"/><rect x="1026" y="503" width="28" height="4" fill="#121826" opacity=".35"/><rect x="1062" y="596" width="40" height="124" rx="3" fill="#C2A64B"/><rect x="1066" y="614" width="32" height="4" fill="#121826" opacity=".35"/><rect x="1106" y="598" width="31" height="122" rx="3" fill="#6389C6" transform="rotate(-8 1137 720)"/><rect x="1110" y="616" width="23" height="4" fill="#121826" opacity=".35" transform="rotate(-8 1137 720)"/>
  <rect x="740" y="720" width="420" height="10" rx="3" fill="#C2A64B"/>
  <rect x="24" y="24" width="1152" height="772" rx="10" fill="none" stroke="#877B8F" stroke-width="2" opacity=".7"/>
  <text x="80" y="130" font-family="Consolas,'JetBrains Mono',ui-monospace,monospace" font-size="22" letter-spacing="8" fill="#C2A64B">READING NIGHT · VOL.12</text>
  <text x="76" y="262" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif" font-size="104" font-weight="700" letter-spacing="4" fill="#BBCBEE">夜の読書会</text>
  <text x="80" y="330" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP',sans-serif" font-size="30" fill="#BBCBEE" opacity=".85">閉館後の書架で、一冊を声に出して読む。</text>
  <rect x="80" y="548" width="92" height="46" rx="23" fill="#549E6A" stroke="#676248" stroke-width="2"/><text x="126" y="579" text-anchor="middle" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP',sans-serif" font-size="24" font-weight="700" fill="#002003">朗読</text><rect x="186" y="548" width="92" height="46" rx="23" fill="#6389C6" stroke="#63576E" stroke-width="2"/><text x="232" y="579" text-anchor="middle" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP',sans-serif" font-size="24" font-weight="700" fill="#070E47">珈琲</text><rect x="292" y="548" width="137" height="46" rx="23" fill="#CC6B79" stroke="#725457" stroke-width="2"/><text x="360.5" y="579" text-anchor="middle" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP',sans-serif" font-size="24" font-weight="700" fill="#35000D">定員 12</text>
  <rect x="80" y="650" width="336" height="12" fill="#CC6B79"/><rect x="416" y="650" width="96" height="12" fill="#C2A64B"/><rect x="512" y="650" width="48" height="12" fill="#F3D56B"/>
  <text x="80" y="720" font-family="Consolas,'JetBrains Mono',ui-monospace,monospace" font-size="30" letter-spacing="4" fill="#F3D56B">11.28 FRI 20:00</text>
  <rect width="1200" height="820" filter="url(#grain)"/>
</svg>
