<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" role="img" aria-labelledby="t">
  <title id="t">Markdown を Lucivo で誌面と発表に組む流れ</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94A3B8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="640" height="220" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="639" height="219" rx="19.5" fill="none" stroke="#CBD5E1"/>

  <!-- Markdown -->
  <g filter="url(#shadow)">
    <rect x="40" y="48" width="150" height="124" rx="14" fill="#FFFFFF"/>
  </g>
  <rect x="40.5" y="48.5" width="149" height="123" rx="13.5" fill="none" stroke="#E2E8F0"/>
  <text x="60" y="80" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="700" fill="#2563EB"># </text>
  <rect x="78" y="70" width="80" height="10" rx="5" fill="#334155"/>
  <rect x="60" y="96" width="110" height="7" rx="3.5" fill="#CBD5E1"/>
  <rect x="60" y="111" width="92" height="7" rx="3.5" fill="#CBD5E1"/>
  <rect x="60" y="126" width="102" height="7" rx="3.5" fill="#CBD5E1"/>
  <text x="115" y="160" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="700" fill="#475569">Markdown</text>

  <!-- 矢印 -->
  <path d="M202 110H244" stroke="url(#beam)" stroke-width="3" stroke-linecap="round"/>
  <path d="M238 103L246 110L238 117" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lucivo -->
  <g filter="url(#shadow)">
    <rect x="258" y="40" width="124" height="140" rx="18" fill="url(#core)"/>
  </g>
  <polygon points="320,66 346,81 346,111 320,126 294,111 294,81" fill="none" stroke="#A5F3FC" stroke-width="2.5"/>
  <polygon points="320,76 334,96 320,116 306,96" fill="#22D3EE" fill-opacity="0.35" stroke="#A5F3FC" stroke-width="1.5"/>
  <circle cx="320" cy="96" r="4" fill="#F8FAFC"/>
  <text x="320" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Noto Sans JP', sans-serif" font-size="15" font-weight="800" letter-spacing="1.5" fill="#F8FAFC">Lucivo</text>

  <!-- 矢印 -->
  <path d="M394 110H436" stroke="url(#beam)" stroke-width="3" stroke-linecap="round"/>
  <path d="M430 103L438 110L430 117" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 誌面・発表 -->
  <g filter="url(#shadow)">
    <rect x="450" y="48" width="150" height="124" rx="14" fill="#FFFFFF"/>
  </g>
  <rect x="450.5" y="48.5" width="149" height="123" rx="13.5" fill="none" stroke="#E2E8F0"/>
  <rect x="466" y="64" width="22" height="5" rx="2.5" fill="#E29578"/>
  <rect x="491" y="64" width="22" height="5" rx="2.5" fill="#EBB453"/>
  <rect x="516" y="64" width="22" height="5" rx="2.5" fill="#6CC4C9"/>
  <rect x="541" y="64" width="22" height="5" rx="2.5" fill="#9CCB86"/>
  <rect x="466" y="80" width="56" height="44" rx="8" fill="#FDF2EE"/>
  <rect x="528" y="80" width="56" height="44" rx="8" fill="#ECF7F7"/>
  <circle cx="494" cy="102" r="9" fill="#E29578"/>
  <path d="M542 112L552 98L562 106L572 92" fill="none" stroke="#6CC4C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="466" y="132" width="118" height="6" rx="3" fill="#E2E8F0"/>
  <text x="525" y="160" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="700" fill="#475569">誌面・発表</text>
</svg>
